name: Metrics

# NOTE (2026-10): the hourly schedule was disabled because METRICS_TOKEN
# (created 2024-04-12) had expired, which left github-metrics.svg frozen at
# "Last updated 12 May 2024" and made every scheduled run hang.
#
# To turn metrics back on:
#   1. Create a classic PAT with the `repo` scope (plus `read:user`).
#   2. Save it as the METRICS_TOKEN repository secret.
#   3. Uncomment the schedule trigger below.
#   4. Run this workflow manually once to verify, then re-add the
#      github-metrics.svg image to README.md.
on:
  # schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          # The following scopes are required:
          #  - public_access (default scope)
          #  - repo
          # The following additional scopes may be required:
          #  - read:org      (for organization related metrics)
          #  - read:user     (for user related data)
          #  - read:packages (for some packages related data)
          #  - repo          (optional, if you want to include private repositories)
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: axsddlr
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: B
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_types: commit
          plugin_traffic: yes
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 60
          plugin_habits_facts: yes
          plugin_habits_from: 1000
          plugin_habits_languages_limit: 20
          plugin_habits_languages_threshold: 0%
